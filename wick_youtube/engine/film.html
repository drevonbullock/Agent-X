<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wick film</title>
<style>
  @font-face { font-family: Fredoka; font-weight: 600; src: url(node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
  @font-face { font-family: Marker; src: url(node_modules/@fontsource/permanent-marker/files/permanent-marker-latin-400-normal.woff2); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas#out { display: block; width: 100vw; height: auto; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
  // One page, two modes: headless capture calls renderAt(t) per frame;
  // ?play=1 plays it live in any browser for a quick look.
  const q = new URLSearchParams(location.search);
  const W = +q.get("w") || 1920, H = +q.get("h") || 1080;
  await Promise.all(["600 40px Fredoka", "700 40px Fredoka", "40px Marker"].map((f) => document.fonts.load(f)));
  const mod = await import(`./films/${q.get("film")}/film.js`);
  const film = await mod.create({ W, H, out: document.getElementById("out") });
  window.FILM = { duration: film.duration, fps: film.fps || 30 };
  window.renderAt = (t) => film.renderAt(t);
  window.grab = (type = "image/jpeg", quality = 0.94) => film.out.toDataURL(type, quality);
  if (q.get("play")) {
    const t0 = performance.now();
    const loop = () => { film.renderAt(((performance.now() - t0) / 1000) % film.duration); requestAnimationFrame(loop); };
    loop();
  }
  window.READY = true;
</script>
</body>
</html>
