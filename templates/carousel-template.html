<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #04081a;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #04081a;
  }

  /* ── BACKGROUND LAYERS ──────────────────────────── */
  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1;
  }

  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 0% 100%, rgba(8,18,60,0.92) 0%, transparent 60%),
      radial-gradient(ellipse at 0% 0%, rgba(0,80,100,0.32) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 0%, rgba(80,100,130,0.22) 0%, transparent 45%);
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(22,42,78,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(22,42,78,0.4) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  /* ── CORNER BRACKETS ────────────────────────────── */
  .bracket { position: absolute; width: 40px; height: 40px; }
  .btl { top: 36px; left: 36px; border-top: 3px solid #00D2FF; border-left: 3px solid #00D2FF; }
  .btr { top: 36px; right: 36px; border-top: 3px solid #00D2FF; border-right: 3px solid #00D2FF; }
  .bbl { bottom: 36px; left: 36px; border-bottom: 3px solid #00D2FF; border-left: 3px solid #00D2FF; }
  .bbr { bottom: 36px; right: 36px; border-bottom: 3px solid #00D2FF; border-right: 3px solid #00D2FF; }

  /* ── FOOTER ─────────────────────────────────────── */
  .footer {
    position: absolute;
    bottom: 58px;
    left: 72px;
    right: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .signature {
    font-size: 16px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(180,200,218,0.4);
    font-weight: 600;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .slide-num {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.05em;
  }

  .share-save {
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #00D2FF;
    opacity: 0.75;
    font-weight: 600;
  }

  /* ── HOOK SLIDE ─────────────────────────────────── */
  .hook-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 80px 100px;
    text-align: center;
  }

  .topic-tag {
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #00D2FF;
    font-weight: 700;
    margin-bottom: 36px;
  }

  .hook-headline {
    font-size: 88px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 20px;
  }

  .hook-headline .accent { color: #00D2FF; }

  .hook-divider {
    width: 72px;
    height: 4px;
    background: #00D2FF;
    margin: 28px auto;
  }

  .hook-sub {
    font-size: 32px;
    color: #B4C8DA;
    line-height: 1.5;
    max-width: 680px;
    margin-bottom: 40px;
  }

  .swipe-cta {
    font-size: 22px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #00D2FF;
    opacity: 0.85;
    font-weight: 600;
  }

  /* ── CONTENT SLIDE ──────────────────────────────── */
  .content-wrap {
    position: absolute;
    inset: 0;
    padding: 58px 64px 110px 64px;
    display: flex;
    flex-direction: column;
  }

  .slide-tag {
    font-size: 17px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #00D2FF;
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
  }

  .content-headline {
    font-size: 54px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.08;
    letter-spacing: -0.02em;
    text-align: center;
  }

  .content-headline .accent { color: #00D2FF; }

  .content-divider {
    width: 60px;
    height: 3px;
    background: #00D2FF;
    margin: 18px auto 20px;
  }

  .icons-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 22px;
  }

  .icons-row svg {
    width: 80px;
    height: 80px;
    opacity: 0.85;
  }

  .cards-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  .card {
    background: rgba(0,210,255,0.06);
    border: 1.5px solid rgba(0,210,255,0.18);
    border-radius: 12px;
    padding: 18px 22px;
    display: flex;
    align-items: flex-start;
    gap: 20px;
    flex: 1;
  }

  .card-num {
    font-size: 20px;
    font-weight: 800;
    color: #00D2FF;
    letter-spacing: 0.05em;
    min-width: 40px;
    padding-top: 2px;
  }

  .card-title {
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
  }

  .card-sub {
    font-size: 23px;
    color: #B4C8DA;
    line-height: 1.45;
    margin-top: 5px;
  }

  /* ── CTA SLIDE ──────────────────────────────────── */
  .cta-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 80px 100px;
    text-align: center;
  }

  .cta-tag {
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #00D2FF;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .cta-headline {
    font-size: 80px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }

  .cta-headline .accent { color: #00D2FF; }

  .cta-divider {
    width: 64px;
    height: 4px;
    background: #00D2FF;
    margin: 24px auto;
  }

  .cta-sub {
    font-size: 24px;
    color: #B4C8DA;
    line-height: 1.55;
    max-width: 680px;
    margin-bottom: 28px;
  }

  .comment-cta {
    font-size: 22px;
    color: #ffffff;
    margin-bottom: 24px;
    font-weight: 500;
  }

  .comment-cta .keyword {
    color: #00D2FF;
    font-weight: 800;
  }

  .follow-btn {
    display: inline-block;
    padding: 16px 44px;
    border: 2px solid #00D2FF;
    border-radius: 4px;
    font-size: 18px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #00D2FF;
    font-weight: 700;
  }

  /* ── GEO OVERLAY (hook + cta slides) ───────────── */
  .geo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.055;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- ────────────────────────────────────────────────
     SLIDE TYPE: Set data-type to hook | content | cta
     Puppeteer reads this to know which layout to render
     ──────────────────────────────────────────────── -->

<!-- ── HOOK SLIDE EXAMPLE ──────────────────────── -->
<div class="slide" id="slide" data-type="hook">
  <img class="bg-image" src="{{BG_IMAGE_PATH}}" alt="">
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <svg class="geo" viewBox="0 0 1080 1080">
    <circle cx="540" cy="540" r="400" fill="none" stroke="#00D2FF" stroke-width="2"/>
    <circle cx="540" cy="540" r="290" fill="none" stroke="#00D2FF" stroke-width="1"/>
    <circle cx="540" cy="540" r="180" fill="none" stroke="#00D2FF" stroke-width="1"/>
    <line x1="140" y1="540" x2="940" y2="540" stroke="#00D2FF" stroke-width="1"/>
    <line x1="540" y1="140" x2="540" y2="940" stroke="#00D2FF" stroke-width="1"/>
  </svg>

  <div class="vignette"></div>
  <div class="bracket btl"></div>
  <div class="bracket btr"></div>
  <div class="bracket bbl"></div>
  <div class="bracket bbr"></div>

  <div class="hook-content">
    <div class="topic-tag">{{TOPIC_TAG}}</div>
    <div class="hook-headline">{{HEADLINE_LINE1}}<br>{{HEADLINE_LINE2}}<br><span class="accent">{{HEADLINE_LINE3}}</span></div>
    <div class="hook-divider"></div>
    <div class="hook-sub">{{SUBTEXT}}</div>
    <div class="swipe-cta">Swipe to see all {{SLIDE_COUNT}} &nbsp;&#x203A;</div>
  </div>

  <div class="footer">
    <div class="signature">D R E &apos; V O N &nbsp; B U L L O C K</div>
    <div class="share-save">Share &amp; Save &#x2197;</div>
  </div>
</div>
